# Publish the AgroRestore AI interactive map (built by the notebook) on GitHub Pages:
#   https://typsonrs.github.io/ds-capstoneKSD/
# Runs on every push to main that changes the map, or by hand (Actions tab -> "Deploy interactive map" -> Run).
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy interactive map

on:
  push:
    branches: [main]
    paths:
      - "PROJECT_DATA_SCIENCE/reports/FIGURES/interactive/**"
      - ".github/workflows/deploy_map.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Build the site folder
        run: |
          mkdir site
          cp PROJECT_DATA_SCIENCE/reports/FIGURES/interactive/* site/
          cp site/interactive_map.html site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
