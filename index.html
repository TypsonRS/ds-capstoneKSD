<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgroRestore AI Demo Day</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap">
<style>
  /* Layout: one centered 16:9 stage, controls beneath, thumbnail strip at the bottom. Single dark look matching the deck. */
  :root {
    --bg: #12211a; --panel: #1b2e22; --line: #2e4a39; --fg: #eef3ef; --muted: #9fbf9f; --accent: #6fbf73;
    --font: "Noto Sans", "Segoe UI", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); }
  .wrap { max-width: 1200px; margin: 0 auto; padding-block: 20px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
  .sub { color: var(--muted); font-size: .9rem; }
  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: var(--panel);
    border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .stage img { width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; }
  .hit { position: absolute; top: 0; bottom: 0; width: 30%; background: none; border: 0; cursor: pointer; }
  .hit.prev { left: 0; } .hit.next { right: 0; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .title { color: var(--muted); font-size: .95rem; min-width: 0; flex: 1 1 240px; }
  .ctrls { display: flex; gap: 8px; align-items: center; }
  button.btn { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 14px; font: inherit; font-size: .9rem; cursor: pointer; }
  button.btn:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .count { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 4.5em; text-align: center; }
  .thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .thumbs button { flex: 0 0 auto; width: 120px; padding: 0; border: 2px solid transparent; border-radius: 4px;
    background: var(--panel); cursor: pointer; opacity: .65; }
  .thumbs button[aria-current="true"] { border-color: var(--accent); opacity: 1; }
  .thumbs img { display: block; width: 100%; border-radius: 2px; }
  .hint { color: var(--muted); font-size: .8rem; }
  :fullscreen .stage, .stage:fullscreen { border-radius: 0; background: #000; }
</style>
<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AgroRestore AI <span class="sub">· Demo Day</span></h1>
    <span class="sub">Kueshi Semanou Dahan · Team NeuralRoots</span>
  </header>

  <div class="stage" id="stage">
    <img id="slide" src="slides/slide-01.png" alt="">
    <button class="hit prev" id="hitPrev" aria-label="Previous slide"></button>
    <button class="hit next" id="hitNext" aria-label="Next slide"></button>
  </div>

  <div class="bar">
    <div class="title" id="title"></div>
    <div class="ctrls">
      <button class="btn" id="prev">← Prev</button>
      <span class="count" id="count"></span>
      <button class="btn" id="next">Next →</button>
      <button class="btn" id="fs">Fullscreen</button>
    </div>
  </div>

  <nav class="thumbs" id="thumbs" aria-label="Slides"></nav>
  <div class="hint">Use ← → keys, swipe, or click the slide edges to navigate.</div>
</div>

<script>
  const titles = [
    "AgroRestore AI",
    "Restoration and agriculture money is lost on the wrong sites",
    "Study area and 20 years of satellite data",
    "Turning 20 years of greening into a target",
    "20 years of change: hotter, greener, more fire",
    "Conditions move together",
    "Spatial validation: Random Forest selected",
    "The opportunity map and what drives it",
    "47% rated high; 34% where all four agree",
    "Only high-potential land pays back",
    "From notebook to decision tool: Streamlit app",
    "Thank you"
  ];
  const src = i => `slides/slide-${String(i + 1).padStart(2, "0")}.png`;
  const N = titles.length;
  const $ = id => document.getElementById(id);
  const thumbs = $("thumbs");
  titles.forEach((t, i) => {
    const b = document.createElement("button");
    b.id = "thumb-" + (i + 1);
    b.setAttribute("aria-label", `Slide ${i + 1}: ${t}`);
    b.innerHTML = `<img src="${src(i)}" alt="" loading="lazy">`;
    b.onclick = () => go(i);
    thumbs.appendChild(b);
  });
  let cur = 0;
  function go(i) {
    cur = Math.max(0, Math.min(N - 1, i));
    $("slide").src = src(cur);
    $("slide").alt = `Slide ${cur + 1}: ${titles[cur]}`;
    $("title").textContent = titles[cur];
    $("count").textContent = `${cur + 1} / ${N}`;
    [...thumbs.children].forEach((b, j) => b.setAttribute("aria-current", j === cur));
    thumbs.children[cur].scrollIntoView({ block: "nearest", inline: "nearest" });
    if (location.hash !== "#slide-" + (cur + 1)) history.replaceState(null, "", "#slide-" + (cur + 1));
    if (cur + 1 < N) new Image().src = src(cur + 1);
  }
  $("prev").onclick = $("hitPrev").onclick = () => go(cur - 1);
  $("next").onclick = $("hitNext").onclick = () => go(cur + 1);
  $("fs").onclick = () => { const s = $("stage"); (document.fullscreenElement ? document.exitFullscreen() : s.requestFullscreen?.())?.catch?.(() => {}); };
  document.addEventListener("keydown", e => {
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
    else if (e.key === "Home") go(0); else if (e.key === "End") go(N - 1);
  });
  let x0 = null;
  $("stage").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  $("stage").addEventListener("touchend", e => {
    if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1));
  });
  const fromHash = () => { const m = /^#slide-(\d+)$/.exec(location.hash); return m ? +m[1] - 1 : 0; };
  window.addEventListener("hashchange", () => go(fromHash()));
  go(fromHash());
</script>
</body>
</html>
