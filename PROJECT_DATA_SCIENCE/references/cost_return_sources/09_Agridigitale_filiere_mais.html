T11:27:35.000000Z&quot;,&quot;updated_at&quot;:&quot;2024-09-27T11:27:35.000000Z&quot;,&quot;ads_count&quot;:1}}],&quot;youtubeChannelId&quot;:&quot;UCc-oD_vR9ilzlyeZKemRZ-w&quot;,&quot;article&quot;:{&quot;id&quot;:3876,&quot;title&quot;:&quot;{ \&quot;en\&quot;: \&quot;\&quot;, \&quot;fr\&quot;: \&quot;Comment rendre la fili\u00e8re ma\u00efs plus comp\u00e9titive ? \&quot; }&quot;,&quot;slug&quot;:&quot;comment_rendre_la_filire_mas_plus_comptitive_&quot;,&quot;summary&quot;:&quot;{ \&quot;en\&quot;: \&quot;\&quot;, \&quot;fr\&quot;: \&quot;Le ma\u00efs est la principale culture c\u00e9r\u00e9ali\u00e8re de base la plus consomm\u00e9e, devant le sorgho, le mil et le riz. C\u2019est la c\u00e9r\u00e9ale de base de l\u2019alimentation de plus de 90% des togolais.\&quot; }&quot;,&quot;content&quot;:&quot;{ \&quot;en\&quot;: \&quot;\&quot;, \&quot;fr\&quot;: \&quot;&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Le manque de financement ad&amp;eacute;quat dans cette fili&amp;egrave;re constitue aujourd&amp;rsquo;hui un frein &amp;agrave; son d&amp;eacute;veloppement. La quantit&amp;eacute; de ma&amp;iuml;s grains produite au cours de la campagne agricole 2020\/2021 est de 885 030 tonnes contre un besoin de 720 935 tonnes. &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;La superficie totale emblav&amp;eacute;e au cours de cette m&amp;ecirc;me campagne est de 721 872 ha. Le rendement au niveau national est de 1 230 kg\/ha.&amp;nbsp; &lt;\/span&gt;&lt;\/span&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;La production brute de ma&amp;iuml;s a par exemple &amp;eacute;volu&amp;eacute; depuis 2009 passant de 650 000 tonnes &amp;agrave; 912 000 tonnes en 2019. &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Cette &amp;eacute;volution sensible est entrecoup&amp;eacute;e par des campagnes de chute de la production expliqu&amp;eacute;e en partie par le r&amp;eacute;sultat conjugu&amp;eacute; de la diminution des superficies emblav&amp;eacute;es, des al&amp;eacute;as climatiques et parfois de la baisse des rendements.&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;blockquote&gt;\r\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;color:#d35400&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;strong&gt;&lt;em&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;De la n&amp;eacute;cessit&amp;eacute; du plan de d&amp;eacute;veloppement &lt;\/span&gt;&lt;\/em&gt;&lt;\/strong&gt;&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n&lt;\/blockquote&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&amp;nbsp;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Une r&amp;eacute;cente &amp;eacute;tude de la FAO r&amp;eacute;v&amp;eacute;lait clairement que pour avoir du profit dans cette fili&amp;egrave;re, le producteur devrait vendre le kilo du ma&amp;iuml;s &amp;agrave; 250 FCFA. &lt;\/span&gt;&lt;\/span&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Or selon les donn&amp;eacute;es recueillies, le prix du kilo n&amp;rsquo;avait pas d&amp;eacute;pass&amp;eacute; 180 FCFA au niveau des producteurs de 2010 &amp;agrave; 2020. &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Ceci traduit de fa&amp;ccedil;on claire que la production du ma&amp;iuml;s n&amp;rsquo;est pas rentable et donc non comp&amp;eacute;titive. Cette situation pousse d&amp;rsquo;ailleurs certains producteurs &amp;agrave; r&amp;eacute;duire leur surface cultivable au profit d&amp;rsquo;autres cultures. &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Pour r&amp;eacute;organiser la fili&amp;egrave;re et la rendre plus comp&amp;eacute;titive, la FAO apporte son soutien au pays en &amp;eacute;laborant un plan de d&amp;eacute;veloppement afin de r&amp;eacute;pondre aux besoins en financement et ceux du march&amp;eacute; tout en tenant compte des impacts socio&amp;eacute;conomiques et environnementaux de la fili&amp;egrave;re.&amp;nbsp;&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;blockquote&gt;\r\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;strong&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;(Re)lire&amp;nbsp;: &lt;\/span&gt;&lt;\/strong&gt;&lt;strong&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;&lt;a href=&#039;{{BASE_URL}}article\/la_varit_de_mas_qu_il_vous_faut_&#039; style=&#039;color:blue; text-decoration:underline&#039;&gt;La vari&amp;eacute;t&amp;eacute; de ma&amp;iuml;s qu&amp;rsquo;il vous faut&lt;\/a&gt;&lt;\/span&gt;&lt;\/strong&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n&lt;\/blockquote&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Ce plan de d&amp;eacute;veloppement prend en consid&amp;eacute;ration la croissance &amp;eacute;conomique de la fili&amp;egrave;re, l&amp;rsquo;importance de la r&amp;eacute;partition de la valeur ajout&amp;eacute;e entre les intervenants et des actions de recherche d&amp;eacute;veloppement sur les cha&amp;icirc;nes de valeur agricoles.&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;L&amp;rsquo;objectif global qui d&amp;eacute;coule de la vision de ce plan de d&amp;eacute;veloppement est de porter la production &amp;agrave; l&amp;rsquo;horizon 2030, &amp;agrave; 211 000 tonnes de ma&amp;iuml;s grains de bonne qualit&amp;eacute; destin&amp;eacute;es &amp;agrave; la provenderie et aux unit&amp;eacute;s de production de farine et de semoule. &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Il s&amp;rsquo;agit de faire de la fili&amp;egrave;re ma&amp;iuml;s, une fili&amp;egrave;re porteuse, comp&amp;eacute;titive, inclusive, cr&amp;eacute;atrice d&amp;rsquo;emplois et contribuant efficacement &amp;agrave; la s&amp;eacute;curit&amp;eacute; alimentaire, &amp;agrave; l&amp;rsquo;am&amp;eacute;lioration durable des revenus des acteurs ainsi qu&amp;rsquo;&amp;agrave; l&amp;rsquo;&amp;eacute;quilibre de la balance.&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;blockquote&gt;\r\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;color:#d35400&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;strong&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;7 diagnostics th&amp;eacute;rapeutiques &amp;nbsp;&lt;\/span&gt;&lt;\/strong&gt;&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n&lt;\/blockquote&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Le plan de d&amp;eacute;veloppement &amp;eacute;num&amp;egrave;re quelques contraintes qui doivent retenir l&amp;rsquo;attention des autorit&amp;eacute;s pour une meilleure r&amp;eacute;organisation.&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;&lt;span style=&#039;color:#c0392b&#039;&gt;1&lt;\/span&gt; : Il est important de savoir que les producteurs ont besoin d&amp;rsquo;avoir des contrats formels pour les rassurer dans la production et sur le prix. C&amp;rsquo;est la contrainte majeure &amp;agrave; leur niveau. &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Le contrat leur permettra de bien planifier la production et servira de support pour la n&amp;eacute;gociation des cr&amp;eacute;dits de campagne de production. &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Le faible taux de dessouchement des superficies emblav&amp;eacute;es (en majorit&amp;eacute; les ZAAP) rend difficile le labour avec tracteur et l&amp;rsquo;insuffisance d&amp;rsquo;&amp;eacute;quipements tels que les tracteurs constituent un frein &amp;agrave; l&amp;rsquo;augmentation des superficies cultiv&amp;eacute;es et ne permettent pas de labourer et de semer &amp;agrave; temps. &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;On note ici des difficult&amp;eacute;s d&amp;rsquo;acc&amp;egrave;s au cr&amp;eacute;dit pour le financement de la production du ma&amp;iuml;s avec un taux d&amp;rsquo;int&amp;eacute;r&amp;ecirc;t supportable aux producteurs (8 &amp;agrave; 10%). &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;blockquote&gt;\r\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;strong&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Re(lire)&amp;nbsp;: &lt;\/span&gt;&lt;\/strong&gt;&lt;strong&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;&lt;a href=&#039;{{BASE_URL}}article\/comment_russir_la_culture_du_mas_dans_la_rgion_des_savanes_&#039; style=&#039;color:blue; text-decoration:underline&#039;&gt;Comment r&amp;eacute;ussir la culture du ma&amp;iuml;s dans la r&amp;eacute;gion des savanes?&lt;\/a&gt;&lt;\/span&gt;&lt;\/strong&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n&lt;\/blockquote&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Le co&amp;ucirc;t de production s&amp;rsquo;&amp;eacute;l&amp;egrave;ve &amp;agrave; 296 700 FCFA\/ha, or le plus souvent ce sont des semences (10 000 FCFA\/ha) et des engrais (75 000 FCFA\/ha) qui sont octroy&amp;eacute;s aux producteurs soit 85 000 FCFA\/ha, ce qui repr&amp;eacute;sente un taux de 30% du besoin. Ce qui implique que le reste des 75% des besoins est support&amp;eacute; par le producteur lui-m&amp;ecirc;me.&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;&lt;span style=&#039;color:#c0392b&#039;&gt;2 &lt;\/span&gt;: Un faible niveau de fertilit&amp;eacute; des sols et la non pratique des techniques de gestion int&amp;eacute;gr&amp;eacute;e de la fertilit&amp;eacute; des sols qui pourtant sont bien connues des producteurs.&amp;nbsp;&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;&lt;span style=&#039;color:#c0392b&#039;&gt;3&lt;\/span&gt; : La non disponibilit&amp;eacute; des intrants en quantit&amp;eacute; suffisante (850 tonnes disponibles contre un besoin de 14 440 tonnes de semences certifi&amp;eacute;es et 19670,2 tonnes de NPK : 15- 15-15 et ur&amp;eacute;e 46% disponibles contre un besoin de 214 582,5 tonnes), &amp;agrave; temps et &amp;agrave; proximit&amp;eacute; des producteurs entra&amp;icirc;nant le non suivi des itin&amp;eacute;raires techniques et donc une mauvaise r&amp;eacute;colte. &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;&lt;span style=&#039;color:#c0392b&#039;&gt;4&lt;\/span&gt; : L&amp;rsquo;acc&amp;egrave;s limit&amp;eacute; aux engrais chimiques et semences dus &amp;agrave; leurs co&amp;ucirc;ts &amp;eacute;lev&amp;eacute;s (500 FCFA\/ kg de semences certifi&amp;eacute;es et 12 500 FCFA pour un sac de 50kg) par rapport &amp;agrave; ceux des pays limitrophes. Ce ph&amp;eacute;nom&amp;egrave;ne fait que les producteurs qui se trouvent proches des fronti&amp;egrave;res pr&amp;eacute;f&amp;egrave;rent acheter dans ces pays (surtout le Ghana) que ceux de leur propre pays.&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;&lt;span style=&#039;color:#c0392b&#039;&gt;5&lt;\/span&gt; : L&amp;rsquo;utilisation des vari&amp;eacute;t&amp;eacute;s de ma&amp;iuml;s &amp;agrave; faible rendement (le rendement potentiel maximal des vari&amp;eacute;t&amp;eacute;s utilis&amp;eacute;es est 6 t\/ha). Ce qui ne permet pas aux producteurs de rentabiliser leurs productions. Depuis 2010, le rendement national n&amp;rsquo;a jamais exc&amp;eacute;d&amp;eacute; 1,5 t\/ha. &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;&lt;span style=&#039;color:#c0392b&#039;&gt;6&lt;\/span&gt; : L&amp;rsquo;insuffisance de magasins (environ 444 magasins en construction et 66 magasins d&amp;eacute;j&amp;agrave; construits gr&amp;acirc;ce &amp;agrave; l&amp;rsquo;UEMOA) pour stocker le ma&amp;iuml;s r&amp;eacute;colt&amp;eacute; dans la plupart des r&amp;eacute;gions conduit &amp;agrave; la m&amp;eacute;vente ou au bradage de leurs produits. &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Cette situation oblige parfois les producteurs &amp;agrave; garder les productions plus longtemps avec parfois des risques de destruction de ma&amp;iuml;s grains par des ravageurs de stock. Cette insuffisance d&amp;rsquo;infrastructures de stockage de ma&amp;iuml;s handicape la pratique de la vente group&amp;eacute;e.&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;&lt;span style=&#039;color:#c0392b&#039;&gt;7&lt;\/span&gt; : La non ma&amp;icirc;trise de l&amp;rsquo;eau laisse la culture &amp;agrave; la merci de la nature et occasionne parfois l&amp;rsquo;obtention du faible rendement et la limitation des cycles de production. &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Cette situation est aussi observ&amp;eacute;e sur les trente-trois (33) ZAAP (avec une superficie totale 1 043 ha) sur lesquelles le ma&amp;iuml;s est cultiv&amp;eacute;. Il faut noter que sur la plupart de ces ZAAP, le dispositif d&amp;rsquo;irrigation est mal install&amp;eacute; entra&amp;icirc;nant des ravinements et aussi les sources d&amp;rsquo;eau n&amp;rsquo;ont pas &amp;eacute;t&amp;eacute; bien am&amp;eacute;nag&amp;eacute;es (envasement) ou mal positionn&amp;eacute;es (en aval du site am&amp;eacute;nag&amp;eacute;). &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;blockquote&gt;\r\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;color:#d35400&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;strong&gt;&lt;em&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;L&amp;rsquo;id&amp;eacute;e du fonds de d&amp;eacute;veloppement de la fili&amp;egrave;re &lt;\/span&gt;&lt;\/em&gt;&lt;\/strong&gt;&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n&lt;\/blockquote&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Il ressort d&amp;rsquo;apr&amp;egrave;s les analyses des comptes d&amp;rsquo;exploitation au niveau de chaque r&amp;eacute;gion que pour d&amp;eacute;gager du profit, le producteur doit ventre le kilo du ma&amp;iuml;s &amp;agrave; 250 FCFA alors que le prix d&amp;rsquo;achat moyen n&amp;rsquo;a jamais d&amp;eacute;pass&amp;eacute; 180 FCFA le kilo au niveau producteur&lt;\/span&gt;&lt;\/span&gt;.&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Ceci traduit de fa&amp;ccedil;on claire que sur toute la fili&amp;egrave;re, la production du ma&amp;iuml;s n&amp;rsquo;est pas rentable et donc par cons&amp;eacute;quent non comp&amp;eacute;titive d&amp;rsquo;o&amp;ugrave; la n&amp;eacute;cessit&amp;eacute; d&amp;rsquo;agir sur ce maillon par l&amp;rsquo;am&amp;eacute;lioration des vari&amp;eacute;t&amp;eacute;s existantes, l&amp;rsquo;introduction des vari&amp;eacute;t&amp;eacute;s hybrides &amp;agrave; hauts rendements, la mise &amp;agrave; disponibilit&amp;eacute; et &amp;agrave; temps des fertilisants, l&amp;rsquo;appui technique et conseil, la gestion ou la maitrise de l&amp;rsquo;eau etc. afin d&amp;rsquo;augmenter le rendement en ma&amp;iuml;s grains.&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;&amp;quot;Il est important de faire des plaidoyers aupr&amp;egrave;s des institutions financi&amp;egrave;res pour que les producteurs et les coop&amp;eacute;ratives soient appuy&amp;eacute;s non seulement pour leurs besoins en fond de roulement mais aussi pour leur besoin d&amp;rsquo;investissement tels que l&amp;rsquo;achat des &amp;eacute;quipements d&amp;rsquo;irrigation. L&amp;rsquo;acquisition des kits d&amp;rsquo;irrigation va favoriser une production continue dans le temps et un gain plus cons&amp;eacute;quent en p&amp;eacute;riode de raret&amp;eacute; de ce produit&amp;quot;, renseigne le plan de d&amp;eacute;veloppement. &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;blockquote&gt;\r\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;strong&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Re(lire)&amp;nbsp;: &lt;\/span&gt;&lt;\/strong&gt;&lt;strong&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;&lt;a href=&#039;{{BASE_URL}}article\/la_culture_du_mas_rapporte_le_plus_&#039; style=&#039;color:blue; text-decoration:underline&#039;&gt;La culture du ma&amp;iuml;s rapporte le plus&lt;\/a&gt;&lt;\/span&gt;&lt;\/strong&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n&lt;\/blockquote&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;La condition sine qua none pour la r&amp;eacute;ussite de ce plan de d&amp;eacute;veloppement d&amp;#39;apr&amp;egrave;s la FAO, c&amp;#39;est la mise &amp;agrave; disponibilit&amp;eacute; des fonds et leur octroi &amp;agrave; temps aux acteurs. &lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;La mobilisation des fonds pourrait se faire par, soit la mise en place d&amp;rsquo;un fonds de d&amp;eacute;veloppement de la fili&amp;egrave;re &amp;agrave; travers des pr&amp;eacute;l&amp;egrave;vements qui seront effectu&amp;eacute;s au moment de la commercialisation des produits de la fili&amp;egrave;re ; le financement des projets, les dons et subventions.&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;De plus, le plan propose que la commercialisation du ma&amp;iuml;s grains soit r&amp;egrave;glement&amp;eacute;e avec la mise en place d&amp;rsquo;un syst&amp;egrave;me de fixation de prix planch&amp;eacute; et que le conseil interprofessionnel&amp;nbsp;veille &amp;agrave; la suppression de l&amp;rsquo;usage du bol au profit du kg.&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;Pour l&amp;rsquo;essentiel, l&amp;rsquo;objectif vis&amp;eacute;&amp;nbsp;par le plan de d&amp;eacute;veloppement dans la production du ma&amp;iuml;s est d&amp;rsquo;am&amp;eacute;liorer les revenus des producteurs en faisant notamment passer le rendement en grains de ma&amp;iuml;s de 1,23 t\/ha &amp;agrave; 6 t\/ha au moins.&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm; text-align:justify&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;span style=&#039;font-size:17.0pt&#039;&gt;-------------&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\n&lt;p style=&#039;margin-left:0cm; margin-right:0cm&#039;&gt;&lt;span style=&#039;font-size:11pt&#039;&gt;&lt;strong&gt;&lt;em&gt;&lt;span style=&#039;font-size:13.0pt&#039;&gt;La r&amp;eacute;daction &lt;\/span&gt;&lt;\/em&gt;&lt;\/strong&gt;&lt;\/span&gt;&lt;\/p&gt;\r\n\&quot; }&quot;,&quot;featuredImage&quot;:&quot;uploads\/poster_article1641382762.jpg&quot;,&quot;featuredImageUrl&quot;:&quot;https:\/\/agridigitale.com\/storage\/uploads\/poster_article1641382762.jpg&quot;,&quot;legend&quot;:&quot;{ \&quot;en\&quot;: \&quot;\&quot;, \&quot;fr\&quot;: \&quot;L&#039;agriculteur de ma\u00efs au Togo a besoin d&#039;\u00eatre accompagn\u00e9 (image AGD)\&quot; }&quot;,&quot;allowComments&quot;:false,&quot;isHeadline&quot;:false,&quot;status&quot;:3,&quot;publishedAt&quot;:&quot;2023-02-20 22:53:27&quot;,&quot;publisher&quot;:{&quot;id&quot;:1,&quot;uid&quot;:&quot;2f5ec361-9bda-3773-ad2c-036e5e8481a4&quot;,&quot;avatar&quot;:null,&quot;avatarUrl&quot;:null,&quot;fullname&quot;:&quot;Agridigitale Admin&quot;,&quot;lastname&quot;:&quot;Admin&quot;,&quot;firstname&quot;:&quot;Agridigitale&quot;,&quot;email&quot;:&quot;agridigitale@gmail.com&quot;,&quot;emailVerifiedAt&quot;:null,&quot;phone&quot;:&quot;+33 (0)1 58 13 35 15&quot;,&quot;address&quot;:&quot;686, avenue Alexandre Millet\n80508 Reynaud&quot;,&quot;location&quot;:null,&quot;profileType&quot;:&quot;App\\Models\\AdminProfile&quot;,&quot;profileId&quot;:1,&quot;accountStatus&quot;:1,&quot;preferences&quot;:{&quot;locale&quot;:&quot;fr&quot;,&quot;email_notif_enabled&quot;:&quot;1&quot;,&quot;in_app_notif_enabled&quot;:&quot;1&quot;},&quot;authType&quot;:1,&quot;lastLoggedInAt&quot;:&quot;2026-10-27T10:59:33.000000
